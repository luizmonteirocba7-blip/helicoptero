name: Corrigir foto de Missões de Fiscalização

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir botão FOTOS da Missões de Fiscalização
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- 10. Missões de Fiscalização -->'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Card Missões de Fiscalização não encontrado.')

          end = text.find('\n          <!--', start + len(marker))
          if end < 0:
              end = len(text)
          chunk = text[start:end]

          photo = 'https://drive.google.com/file/d/1i5VOf-RKl88KPpeqM9-dGcdkeQAYyqU4/view?usp=drive_link'

          button_pattern = re.compile(r'<button type="button" class="ev-thumb[^>]*>.*?</button>', re.S)
          replacement = (
              '<button type="button" class="ev-thumb !h-auto !overflow-visible !w-full !border-0 '
              '!bg-slate-700/60 hover:!bg-brand-500 hover:!text-white !rounded-lg !py-2 !px-1 '
              '!text-slate-200 !flex !items-center !justify-center !gap-1.5 !text-[10.5px] '
              '!font-extrabold !uppercase tracking-wider transition-colors" '
              f'data-modal-src="{photo}" data-drive-link="1">\n'
              '                <i class="fa-solid fa-camera"></i> Fotos\n'
              '              </button>'
          )

          matches = list(button_pattern.finditer(chunk))
          if not matches:
              raise SystemExit('Botão FOTOS não encontrado no card Missões de Fiscalização.')
          if len(matches) != 1:
              raise SystemExit(f'Esperado 1 botão FOTOS; encontrado {len(matches)}.')

          chunk = button_pattern.sub(replacement, chunk, count=1)
          text = text[:start] + chunk + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Botão FOTOS de Missões de Fiscalização reconstruído corretamente.')
          PY

      - name: Sincronizar títulos oficiais da Visão Geral com a Central de Comprovações
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          courses = [
              ('Infrações Administrativas', 'Curso de Infrações Administrativas', '<!-- 1. Infrações Administrativas -->', '<!-- 2. Perícia de Incêndios -->'),
              ('Perícia de Incêndios', 'Curso de Perícia de Incêndios Florestais', '<!-- 2. Perícia de Incêndios -->', '<!-- 3. Prevenção e Combate -->'),
              ('Prevenção e Combate', 'Curso de Prevenção e Combate a Incêndios Florestais', '<!-- 3. Prevenção e Combate -->', '<!-- 4. Aeronave Remotamente Pilotada -->'),
              ('Aeronave Remotamente Pilotada', 'Curso de Aeronave Remotamente Pilotada', '<!-- 4. Aeronave Remotamente Pilotada -->', '<!-- 5. Fogo Técnico -->'),
              ('Fogo Técnico', 'Curso de Fogo Técnico', '<!-- 5. Fogo Técnico -->', '<!-- 6. Campanhas -->'),
              ('Semana de Prevenção', 'Semana de Prevenção e Preparação para Incêndios Florestais', '<!-- 7. Semana de Prevenção -->', '<!-- 8. Missões de Combate -->'),
          ]

          # Indicadores de Desempenho: mantém os nomes oficiais.
          for metric, title, _, _ in courses:
              card_pattern = re.compile(
                  r'(<button[^>]*class="[^"]*\\bkpi-card\\b[^"]*"[^>]*data-metric="' + re.escape(metric) + r'"[^>]*>.*?<div class="kpi-label">)(.*?)(</div>)',
                  re.S|re.I
              )
              text, count = card_pattern.subn(lambda m: m.group(1) + title + m.group(3), text, count=1)
              if count != 1:
                  raise SystemExit(f'Indicador não encontrado: {metric}')

          # Central de Comprovações: os títulos precisam ser idênticos aos Indicadores.
          evidence_start = text.find('<section id="evidencias"')
          evidence_end = text.find('</section>', evidence_start)
          if evidence_start < 0 or evidence_end < 0:
              raise SystemExit('Central de Comprovações não encontrada')
          evidence = text[evidence_start:evidence_end]

          for metric, title, marker, next_marker in courses:
              start = evidence.find(marker)
              end = evidence.find(next_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Card de evidência não encontrado: {metric}')
              chunk = evidence[start:end]
              chunk, count = re.subn(
                  r'(<h4[^>]*class="[^"]*text-white[^"]*"[^>]*>)(.*?)(</h4>)',
                  lambda m: m.group(1) + title + m.group(3),
                  chunk,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Título de evidência não encontrado: {metric}')
              evidence = evidence[:start] + chunk + evidence[end:]

          text = text[:evidence_start] + evidence + text[evidence_end:]
          p.write_text(text, encoding='utf-8')
          print('Seis títulos oficiais sincronizados em Indicadores e Central de Comprovações.')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          marker = '<!-- 10. Missões de Fiscalização -->'
          start = html.find(marker)
          assert start >= 0, 'Card não encontrado'
          end = html.find('\n          <!--', start + len(marker))
          chunk = html[start:end if end >= 0 else len(html)]

          expected = 'https://drive.google.com/file/d/1i5VOf-RKl88KPpeqM9-dGcdkeQAYyqU4/view?usp=drive_link'
          assert expected in chunk, 'Link da foto ausente'
          assert re.search(r'<button type="button" class="[^"]*ev-thumb[^"]*"[^>]*data-modal-src="' + re.escape(expected) + r'"[^>]*data-drive-link="1"[^>]*>', chunk), 'Atributos do botão incorretos'
          assert 'data-drive-link="1">\n                <i class="fa-solid fa-camera"></i> Fotos' not in chunk, 'Texto data-drive-link ainda aparece dentro do botão'
          assert 'data-drive-link="1">' not in re.sub(r'<button[^>]*>', '', chunk), 'Atributo fora da tag do botão'

          expected_courses = [
              'Curso de Infrações Administrativas',
              'Curso de Perícia de Incêndios Florestais',
              'Curso de Prevenção e Combate a Incêndios Florestais',
              'Curso de Aeronave Remotamente Pilotada',
              'Curso de Fogo Técnico',
              'Semana de Prevenção e Preparação para Incêndios Florestais',
          ]
          for title in expected_courses:
              assert html.count(title) >= 2, f'Título oficial não encontrado duas vezes: {title}'
          print('Validação OK: títulos oficiais conferidos em Indicadores e Central de Comprovações.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: manter titulos oficiais nos indicadores e comprovacoes'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
