name: Corrigir foto de Missões de Fiscalização

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir botão FOTOS da Missões de Fiscalização
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- 10. Missões de Fiscalização -->'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Card Missões de Fiscalização não encontrado.')

          end = text.find('\n          <!--', start + len(marker))
          if end < 0:
              end = len(text)
          chunk = text[start:end]

          photo = 'https://drive.google.com/file/d/1i5VOf-RKl88KPpeqM9-dGcdkeQAYyqU4/view?usp=drive_link'

          # Substitui o botão FOTOS inteiro, preservando o padrão usado pelos cards que já funcionam.
          button_pattern = re.compile(r'<button type="button" class="ev-thumb[^>]*>.*?</button>', re.S)
          replacement = (
              '<button type="button" class="ev-thumb !h-auto !overflow-visible !w-full !border-0 '
              '!bg-slate-700/60 hover:!bg-brand-500 hover:!text-white !rounded-lg !py-2 !px-1 '
              '!text-slate-200 !flex !items-center !justify-center !gap-1.5 !text-[10.5px] '
              '!font-extrabold !uppercase tracking-wider transition-colors" '
              f'data-modal-src="{photo}" data-drive-link="1">\n'
              '                <i class="fa-solid fa-camera"></i> Fotos\n'
              '              </button>'
          )

          matches = list(button_pattern.finditer(chunk))
          if not matches:
              raise SystemExit('Botão FOTOS não encontrado no card Missões de Fiscalização.')
          if len(matches) != 1:
              raise SystemExit(f'Esperado 1 botão FOTOS; encontrado {len(matches)}.')

          chunk = button_pattern.sub(replacement, chunk, count=1)
          text = text[:start] + chunk + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Botão FOTOS de Missões de Fiscalização reconstruído corretamente.')
          PY

      - name: Sincronizar titulos da Visão Geral com a Central de Comprovações
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          mapping = {
              'Infrações Administrativas': 'Infrações Administrativas',
              'Perícia de Incêndios': 'Perícia de Incêndios',
              'Prevenção e Combate': 'Prevenção e Combate',
              'Aeronave Remotamente Pilotada': 'Drone (RPAS)',
              'Fogo Técnico': 'Fogo Técnico',
              'Campanhas': 'Campanhas',
              'Semana de Prevenção': 'Semana de Prevenção',
              'Missões de Combate': 'Missões de Combate',
              'Operações de Fiscalização': 'Operações de Fiscalização',
              'Missões de Fiscalização': 'Missões de Fiscalização',
              'Capacitação de Brigadistas': 'Formação de Brigadistas',
              'Brigada Municipal Mista': 'Brigada Municipal Mista',
              'Publicações': 'Publicações Matérias',
              'Focos de Calor': 'Focos de Calor',
              'BM FEM Capacitadas': 'BM FEM Capacitadas',
              'Op órgãos federais': 'OP Órgãos Federais',
              'Op de Combate': 'OP Combate (Parceria)',
              'Eventos Integrados': 'Eventos Integrados',
              'Área Monitorada': 'Área Monitorada',
              'Autos de Infração': 'Autos de Infração',
          }

          changed = 0
          for metric, title in mapping.items():
              card_pattern = re.compile(
                  r'(<button[^>]*class="[^"]*\\bkpi-card\\b[^"]*"[^>]*data-metric="' + re.escape(metric) + r'"[^>]*>.*?<div class="kpi-label">)(.*?)(</div>)',
                  re.S|re.I
              )
              text, count = card_pattern.subn(lambda m: m.group(1) + title + m.group(3), text, count=1)
              changed += count

          if changed != len(mapping):
              raise SystemExit(f'Foram sincronizados {changed} de {len(mapping)} titulos; abortando para nao alterar parcialmente o painel.')

          p.write_text(text, encoding='utf-8')
          print(f'Titulos sincronizados com sucesso: {changed}')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          marker = '<!-- 10. Missões de Fiscalização -->'
          start = html.find(marker)
          assert start >= 0, 'Card não encontrado'
          end = html.find('\n          <!--', start + len(marker))
          chunk = html[start:end if end >= 0 else len(html)]

          expected = 'https://drive.google.com/file/d/1i5VOf-RKl88KPpeqM9-dGcdkeQAYyqU4/view?usp=drive_link'
          assert expected in chunk, 'Link da foto ausente'
          assert re.search(r'<button type="button" class="[^"]*ev-thumb[^"]*"[^>]*data-modal-src="' + re.escape(expected) + r'"[^>]*data-drive-link="1"[^>]*>', chunk), 'Atributos do botão incorretos'
          assert 'data-drive-link="1">\n                <i class="fa-solid fa-camera"></i> Fotos' not in chunk, 'Texto data-drive-link ainda aparece dentro do botão'
          assert 'data-drive-link="1">' not in re.sub(r'<button[^>]*>', '', chunk), 'Atributo fora da tag do botão'

          expected_titles = [
              'Infrações Administrativas','Perícia de Incêndios','Prevenção e Combate','Drone (RPAS)','Fogo Técnico',
              'Campanhas','Semana de Prevenção','Missões de Combate','Operações de Fiscalização','Missões de Fiscalização',
              'Formação de Brigadistas','Brigada Municipal Mista','Publicações Matérias','Focos de Calor','BM FEM Capacitadas',
              'OP Órgãos Federais','OP Combate (Parceria)','Eventos Integrados','Área Monitorada','Autos de Infração'
          ]
          for title in expected_titles:
              assert f'<div class="kpi-label">{title}</div>' in html, f'Titulo KPI ausente: {title}'
          print('Validação OK: evidencias e titulos da Visão Geral conferidos.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: sincronizar titulos da visao geral'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
