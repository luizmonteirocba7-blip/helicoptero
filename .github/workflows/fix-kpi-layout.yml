name: Fix layout do resumo do contrato

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir HTML quebrado sem alterar o banco de dados
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          changed = False

          # Corrige qualquer fechamento quebrado do elemento de barra.
          patterns = {
              'kpi-bar-fill></div>': 'kpi-bar-fill"></div>',
              'kpi-bar-fill></div': 'kpi-bar-fill"></div',
          }
          for broken, fixed in patterns.items():
              if broken in text:
                  text = text.replace(broken, fixed)
                  changed = True

          # Corrige também variações de classes com a mesma falha de aspas.
          text2 = text.replace('class="kpi-bar-fill is-full>', 'class="kpi-bar-fill is-full">')
          if text2 != text:
              text = text2
              changed = True

          p.write_text(text, encoding='utf-8')
          print('HTML corrigido:', changed)
          PY

      - name: Validar estrutura do resumo
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')

          assert 'kpi-bar-fill></div>' not in html
          assert 'class="kpi-bar-fill"></div>' in html
          assert 'data-metric="Contratação de BM Efetivo"' in html
          assert 'INDICADORES_WEB_APP_URL' in html

          # Confirma que os quatro cards permanecem no resumo do contrato.
          for label in [
              'Contratação BM Temporários',
              'Contratação de BM Efetivo',
              'Tempo Restante',
              'Valor do Contrato',
          ]:
              assert label in html, label

          print('Validação OK. Integração Google Sheets preservada.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma correção necessária.'
            exit 0
          fi
          git commit -m 'fix: corrigir estrutura dos cards do resumo'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
