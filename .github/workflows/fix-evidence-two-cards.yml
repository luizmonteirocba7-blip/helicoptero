name: Atualizar evidencias Fiscalizacao e Autos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar links dos dois cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          cards = {
              'Autos de Infração': {
                  'pdf': 'https://drive.google.com/file/d/1ceVWI4NaH36cjWq7hxKlc1cNeM7e-JFt/view?usp=drive_link',
                  'foto': 'https://drive.google.com/file/d/1YfTwGUAlGAT4kfdsP7EbYJ-4KdHktHU5/view?usp=drive_link',
                  'complete': True,
              },
              'Operações de Fiscalização': {
                  'pdf': 'https://drive.google.com/file/d/1Nfk2QLVKfYePxZZkA0VpQadxCK36a4Le/view?usp=drive_link',
                  'foto': 'https://drive.google.com/file/d/14Yl6WjF5w7QgvBXGLIjnfVB951D71Fwa/view?usp=drive_link',
                  'complete': True,
              },
          }

          for title, links in cards.items():
              marker = f'<h4 class="text-white text-[13px] font-bold leading-snug">{title}</h4>'
              pos = text.find(marker)
              if pos == -1:
                  raise SystemExit(f'Card nao encontrado: {title}')

              start_card = text.rfind('<div class="evidence-card', 0, pos)
              next_card = text.find('<div class="evidence-card', pos + len(marker))
              card_end = next_card if next_card != -1 else len(text)
              if start_card == -1:
                  raise SystemExit(f'Inicio do card nao encontrado: {title}')
              chunk = text[start_card:card_end]

              chunk = re.sub(r'evidence-card-(?:complete|missing)', 'evidence-card-complete', chunk, count=1)
              chunk, n1 = re.subn(r'data-pdf-src="[^"]*"', f'data-pdf-src="{links["pdf"]}"', chunk, count=1)
              chunk, n2 = re.subn(r'data-modal-src="[^"]*"', f'data-modal-src="{links["foto"]}" data-drive-link="1"', chunk, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'Campos não encontrados em {title}: pdf={n1}, foto={n2}')

              text = text[:start_card] + chunk + text[card_end:]

          p.write_text(text, encoding='utf-8')
          print('Links e estados dos cards de Operações e Autos atualizados.')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
            '1ceVWI4NaH36cjWq7hxKlc1cNeM7e-JFt',
            '1YfTwGUAlGAT4kfdsP7EbYJ-4KdHktHU5',
            '1Nfk2QLVKfYePxZZkA0VpQadxCK36a4Le',
            '14Yl6WjF5w7QgvBXGLIjnfVB951D71Fwa',
          ]
          for value in checks:
              assert value in html, value
          op_start = html.find('<!-- 9. Operações de Fiscalização -->')
          op_end = html.find('<!-- 10. Missões de Fiscalização -->', op_start)
          op = html[op_start:op_end]
          assert 'evidence-card-complete' in op
          assert 'data-drive-link="1"' in op
          print('Validacao OK.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git commit -m 'fix: vincular evidencias canonicas de fiscalizacao e autos'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
