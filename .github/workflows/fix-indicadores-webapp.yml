name: Fix indicadores Web App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-indicadores-webapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar painel com Google Sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          webapp = 'https://script.google.com/macros/s/AKfycbzkC_i9XuxvmdDFx2NqAnfWZMzKnJpb9vqW5l3-V3ADPZDGA9E7N0gWEOP0C88n6EHq/exec'

          # Fonte oficial dos indicadores
          text = re.sub(r'const INDICADORES_WEB_APP_URL\s*=\s*"[^"]*";', f'const INDICADORES_WEB_APP_URL = "{webapp}";', text, count=1)

          # Leitura do JSON do Apps Script
          loader = r'''async function carregarIndicadoresWebApp() {
    const response = await fetch(`${INDICADORES_WEB_APP_URL}?t=${Date.now()}`, {
        method: 'GET',
        cache: 'no-store',
        mode: 'cors',
        headers: { 'Accept': 'application/json' }
    });
    if (!response.ok) throw new Error(`Web App indicadores HTTP ${response.status}`);
    const payload = await response.json();
    if (!Array.isArray(payload)) throw new Error('Web App indicadores não retornou uma lista JSON.');
    console.info('[Painel] Indicadores carregados pelo Web App:', payload.length);
    return payload;
}

async function carregarIndicadoresDiretoDaPlanilha() {
    const dadosDiretos = await carregarAba('Página1');
    console.warn('[Painel] Fallback para Página1:', dadosDiretos.length);
    return dadosDiretos;
}'''

          text, n = re.subn(r'async function carregarIndicadoresWebApp\(\)\s*\{.*?\n\}\s*\n\s*(?=async function carregarDadosPlanilha)', loader + '\n\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('carregarIndicadoresWebApp não encontrado')

          planilha_loader = r'''async function carregarDadosPlanilha() {
    const [indicadores, helicoptero, combustivel, seguro, prazo] = await Promise.all([
        carregarIndicadoresWebApp().catch(() => carregarIndicadoresDiretoDaPlanilha()),
        carregarAba(SHEET_NAMES.helicoptero),
        carregarAba(SHEET_NAMES.combustivel),
        carregarAba(SHEET_NAMES.seguro),
        carregarAba(SHEET_NAMES.prazo)
    ]);
    return { indicadores, helicoptero, combustivel, seguro, prazo };
}'''

          text, n = re.subn(r'async function carregarDadosPlanilha\(\)\s*\{.*?\n\}\s*\n\s*(?=async function carregarPainelAPI)', planilha_loader + '\n\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('carregarDadosPlanilha não encontrado')

          # Coluna B do Apps Script = Objetivo Alcançado
          text = re.sub(r'const qtdNum = Number\(item\.ObjetivoAlcancado \?\? item\.Quantidade\) \|\| 0;', "const qtdNum = Number(item.ObjetivoAlcancado ?? item['Objetivo Alcançado'] ?? item['ObjetivoAlcancado '] ?? item.Quantidade) || 0;", text, count=1)

          # Elimina a lista antiga de números fixos
          text, n = re.subn(r'const novosIndicadores\s*=\s*\[.*?\n\s*\];\s*\n\s*novosIndicadores\.forEach\(novo\s*=>\s*\{.*?\n\s*\}\);', 'const novosIndicadores = [];', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('novosIndicadores não encontrado')

          # Contratação BM Efetivo passa a usar a mesma base
          text = re.sub(r'<div class="kpi-value">66</div>', '<div class="kpi-value qtd-value">0</div>', text, count=1)
          text = re.sub(r'(<div class="kpi-card kpi-feature kpi-feature-green"[^>]*)(>)', r'\1 data-metric="Contratação de BM Efetivo"\2', text, count=1)

          marker = '<!-- GOOGLE-SHEETS-INDICADORES-SYNC -->'
          if marker not in text:
              text = text.replace('<head>', '<head>\n' + marker, 1)

          assert webapp in text
          assert 'const novosIndicadores = [];' in text
          assert "item['Objetivo Alcançado']" in text
          assert 'data-metric="Contratação de BM Efetivo"' in text

          p.write_text(text, encoding='utf-8')
          print('Integração com Google Sheets aplicada.')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<!-- GOOGLE-SHEETS-INDICADORES-SYNC -->' in html
          assert 'INDICADORES_WEB_APP_URL' in html
          assert 'carregarIndicadoresWebApp' in html
          assert 'const novosIndicadores = [];' in html
          assert 'data-metric="Contratação de BM Efetivo"' in html
          print('Validação OK.')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sem mudanças.'
            exit 0
          fi
          git commit -m 'fix: ligar indicadores ao Google Sheets'
          git push origin HEAD:main
