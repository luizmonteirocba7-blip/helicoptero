name: Aplicar status das evidencias

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar diferenciacao segura nas caixas
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove apenas rotinas anteriores de destaque de evidencias.
          text = re.sub(r'\n<style id="evidence-card-(?:status|missing)-styles">.*?</style>\n', '\n', text, flags=re.S)
          text = re.sub(r'\n<script id="evidence-card-(?:status|missing)-script">.*?</script>\n', '\n', text, flags=re.S)
          text = re.sub(r'\n<style id="evidence-card-missing-styles">.*?</style>\n', '\n', text, flags=re.S)
          text = re.sub(r'\n<script id="evidence-card-missing-script">.*?</script>\n', '\n', text, flags=re.S)

          css = r'''
<style id="evidence-card-missing-styles">
#evidencias .evidence-card-missing {
  background: rgba(220, 38, 38, 0.20) !important;
  border-color: rgba(248, 113, 113, 0.85) !important;
  box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.18), 0 8px 24px rgba(127, 29, 29, 0.16) !important;
}
#evidencias .evidence-card-missing:hover {
  background: rgba(220, 38, 38, 0.26) !important;
  border-color: rgba(254, 202, 202, 0.95) !important;
}
</style>
'''

          js = r'''
<script id="evidence-card-missing-script">
(function () {
  function hasEvidence(el) {
    if (!el) return false;
    if (el.classList.contains('ev-foot')) {
      const href = (el.getAttribute('href') || '').trim();
      const pdf = (el.getAttribute('data-pdf-src') || '').trim();
      return Boolean(href || pdf);
    }
    if (el.classList.contains('ev-thumb')) {
      const src = (el.getAttribute('data-modal-src') || '').trim();
      if (!src) return false;
      return !/placehold\.co/i.test(src) && !/Aguardando\+Fotos/i.test(src);
    }
    return false;
  }

  function applyEvidenceStatus() {
    const area = document.getElementById('evidencias');
    if (!area) return;
    const grid = Array.from(area.querySelectorAll('.grid')).find(g => g.querySelector('.ev-foot, .ev-thumb'));
    if (!grid) return;

    grid.querySelectorAll(':scope > div').forEach(card => {
      const controls = Array.from(card.querySelectorAll('.ev-foot, .ev-thumb'));
      if (!controls.length) return;
      const complete = controls.every(hasEvidence);
      card.classList.toggle('evidence-card-missing', !complete);
    });
  }

  function start() {
    applyEvidenceStatus();
    setTimeout(applyEvidenceStatus, 500);
    setTimeout(applyEvidenceStatus, 1500);
    setTimeout(applyEvidenceStatus, 3000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
'''

          text = text.replace('</head>', css + '\n</head>', 1)
          text = text.replace('</body>', js + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')

      - name: Validar HTML basico
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html' in html and '</html>' in html
          assert html.count('id="evidence-card-missing-styles"') == 1
          assert html.count('id="evidence-card-missing-script"') == 1
          print('HTML validado.')
          PY

      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: diferenciar caixas de evidencias pendentes com seguranca'
          git push
