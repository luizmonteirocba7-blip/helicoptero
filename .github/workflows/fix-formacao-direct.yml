name: Corrigir botão Formação de Brigadistas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: atualizar PDF e fotos de Formação de Brigadistas') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar card Formação de Brigadistas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          start = html.index('<!-- 11. Formação de Brigadistas -->')
          end = html.index('<!-- 12. Brigada Municipal Mista -->', start)
          section = html[start:end]

          old_pdf = 'data-pdf-src=""'
          new_pdf = 'data-pdf-src="https://drive.google.com/file/d/1VsFQJf7oqUxL7FXfQxdJxmsGZeorZujj/view?usp=drive_link"'
          section = section.replace(old_pdf, new_pdf, 1)

          old_photo = 'data-modal-src="https://placehold.co/1200x800/1e293b/94a3b8?text=Aguardando+Fotos&font=Montserrat"'
          new_photo = 'data-modal-src="https://drive.google.com/file/d/1xL-5IwBGNr4bHktosY6nRkIKGDqod0FQ/view?usp=drive_link" data-drive-link="1"'
          section = section.replace(old_photo, new_photo, 1)

          html = html[:start] + section + html[end:]
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: atualizar PDF e fotos de Formação de Brigadistas'
          git push