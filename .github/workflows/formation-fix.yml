name: Corrigir Formação de Brigadistas

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar index.html
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const branch = 'main';
            const pdf1 = 'https://drive.google.com/file/d/1jGIEOeilTNLV-EZdAKYwnkjEwDMSDzeV/view?usp=drive_link';
            const pdf2 = 'https://drive.google.com/file/d/1uITLqbhnyUfTvhaL-H0yzcvDZ0R9NGpl/view?usp=drive_link';
            const photo = 'https://drive.google.com/file/d/1xL-5IwBGNr4bHktosY6nRkIKGDqod0FQ/view?usp=drive_link';
            const file = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            const sha = file.data.sha;
            let html = Buffer.from(file.data.content, 'base64').toString('utf8');

            const title = '<h4 class="text-white text-[13px] font-bold leading-snug">Formação de Brigadistas</h4>';
            const start = html.indexOf(title);
            const end = html.indexOf('<!-- 12. Brigada Municipal Mista -->', start);
            if (start < 0 || end < 0) throw new Error('Card Formação de Brigadistas não encontrado');
            let section = html.slice(start, end);
            section = section.replace(/data-pdf-src="[^"]*"/, `data-pdf-list="${pdf1}||${pdf2}" data-pdf-src="${pdf1}"`);
            section = section.replace(/data-modal-src="[^"]*"(?: data-drive-link="1")?/, `data-modal-src="${photo}" data-drive-link="1"`);
            html = html.slice(0, start) + section + html.slice(end);

            const helper = `
function openFormationPdfChooser(urls) {
  const old = document.getElementById('formation-pdf-chooser');
  if (old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'formation-pdf-chooser';
  overlay.className = 'fixed inset-0 z-[1000000] flex items-center justify-center bg-slate-950/85 backdrop-blur-sm p-4';
  overlay.innerHTML = '<div class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl"><div class="flex items-start justify-between gap-3 mb-5"><div><h3 class="text-white text-base font-extrabold uppercase tracking-wide">Formação de Brigadistas</h3><p class="text-slate-400 text-xs mt-1">Selecione o documento que deseja abrir.</p></div><button type="button" class="text-slate-400 hover:text-white text-xl" data-close-formation-pdfs>&times;</button></div><div class="space-y-2"><button type="button" class="w-full rounded-xl bg-slate-800 hover:bg-rose-600 px-4 py-3 text-left text-white font-bold transition" data-formation-pdf="0"><i class="fa-regular fa-file-pdf mr-2"></i>PDF 1 — Formação de Brigadistas</button><button type="button" class="w-full rounded-xl bg-slate-800 hover:bg-rose-600 px-4 py-3 text-left text-white font-bold transition" data-formation-pdf="1"><i class="fa-regular fa-file-pdf mr-2"></i>PDF 2 — Formação de Brigadistas</button></div></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay || e.target.closest('[data-close-formation-pdfs]')) { overlay.remove(); return; }
    const btn = e.target.closest('[data-formation-pdf]');
    if (btn) { const src = urls[Number(btn.dataset.formationPdf)] || ''; if (src) window.open(src, '_blank', 'noopener,noreferrer'); overlay.remove(); }
  });
}
`;
            const anchor = '/* =========================================================\n   EVENTOS DOM\n   ========================================================= */';
            if (!html.includes('function openFormationPdfChooser(urls)')) {
              if (!html.includes(anchor)) throw new Error('Âncora EVENTOS DOM não encontrada');
              html = html.replace(anchor, '/* SELETOR PDF FORMAÇÃO */\n' + helper + '\n' + anchor);
            }

            const oldHandler = `    if (t.matches('.ev-foot')) {\n        const pdfSrc = t.dataset.pdfSrc || '';\n        if (/drive\\.google\\.com/i.test(pdfSrc)) {\n            window.open(pdfSrc, '_blank', 'noopener,noreferrer');\n        } else {\n            openPdfModal(pdfSrc);\n        }\n    }`;
            const newHandler = `    if (t.matches('.ev-foot')) {\n        const pdfList = t.dataset.pdfList || '';\n        if (pdfList) {\n            const urls = pdfList.split('||').map(url => url.trim()).filter(Boolean);\n            if (urls.length > 1) { openFormationPdfChooser(urls); return; }\n        }\n        const pdfSrc = t.dataset.pdfSrc || '';\n        if (/drive\\.google\\.com/i.test(pdfSrc)) {\n            window.open(pdfSrc, '_blank', 'noopener,noreferrer');\n        } else {\n            openPdfModal(pdfSrc);\n        }\n    }`;
            if (html.includes(oldHandler)) html = html.replace(oldHandler, newHandler);

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, message: 'fix: Formação de Brigadistas com dois PDFs', content: Buffer.from(html, 'utf8').toString('base64'), sha, branch
            });