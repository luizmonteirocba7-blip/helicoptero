name: Atualizar títulos dos indicadores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar títulos do documento
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'Infrações Administrativas': 'Curso de Infrações Administrativas',
              'Perícia de Incêndios': 'Curso de Perícia de Incêndios Florestais',
              'Prevenção e Combate': 'Curso de Prevenção e Combate a Incêndios Florestais',
              'Drone (RPAS)': 'Curso de Aeronave Remotamente Pilotada',
              'Fogo Técnico': 'Curso de Fogo Técnico',
              'Campanhas': 'Campanhas',
              'Semana de Prevenção': 'Semana de Prevenção e Preparação para Incêndios Florestais',
              'Missões de Combate': 'Missões de Combate a Incêndios Florestais e Queimada Não Autorizada',
              'Operações de Fiscalização': 'Operações de Fiscalização',
              'Missões de Fiscalização': 'Missões de Fiscalização (Propriedades Fiscalizadas)',
              'Formação de Brigadistas': 'Capacitação de Brigadistas',
              'Brigada Municipal Mista': 'Brigada Municipal Mista',
              'Publicações Matérias': 'Publicações Matérias',
              'Focos de Calor': 'Foco de Calor',
              'BM FEM Capacitadas': 'BM FEM Capacitados',
              'OP Órgãos Federais': 'Operação de Fiscalização com Órgãos Federais',
              'OP Combate (Parceria)': 'Operação de Combate em Parceria com Outros CBMs',
          }

          # Só altera o texto exibido no card (.kpi-label). O data-metric permanece intacto
          # para não quebrar a ligação com o Google Sheets.
          for old, new in replacements.items():
              pattern = rf'(<div class="kpi-label">)({re.escape(old)})(</div>)'
              text = re.sub(pattern, rf'\1{new}\3', text, count=1)

          # Preserva e explicita os títulos das seções/documentação do PDF.
          marker = '<!-- TITULOS CONFORME GERAL INDICADOPTRES -->'
          if marker not in text:
              text = text.replace('<head>', '<head>\n' + marker, 1)

          p.write_text(text, encoding='utf-8')
          print('Títulos atualizados conforme o PDF, mantendo data-metric e integração com Google Sheets.')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Curso de Infrações Administrativas',
              'Curso de Perícia de Incêndios Florestais',
              'Curso de Prevenção e Combate a Incêndios Florestais',
              'Curso de Aeronave Remotamente Pilotada',
              'Curso de Fogo Técnico',
              'Semana de Prevenção e Preparação para Incêndios Florestais',
              'Missões de Combate a Incêndios Florestais e Queimada Não Autorizada',
              'Missões de Fiscalização (Propriedades Fiscalizadas)',
              'Operação de Fiscalização com Órgãos Federais',
              'Operação de Combate em Parceria com Outros CBMs'
          ]
          for item in required:
              assert item in html, item
          assert 'data-metric="Infrações Administrativas"' in html
          assert 'data-metric="Perícia de Incêndios"' in html
          assert 'data-metric="Prevenção e Combate"' in html
          assert 'data-metric="Aeronave Remotamente Pilotada"' in html
          assert 'data-metric="Missões de Combate"' in html
          print('Validação OK.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'feat: atualizar titulos dos indicadores conforme documento'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
