name: Repair loading screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch loading screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css = '''\n<style id="loading-screen-repair">\n#loading-screen {\n  pointer-events: none !important;\n}\n#loading-screen.loading-screen-ready {\n  opacity: 0 !important;\n  visibility: hidden !important;\n}\n</style>\n'''

          js = '''\n<script id="loading-screen-repair-script">\n(function () {\n  function hideLoading() {\n    var el = document.getElementById('loading-screen');\n    if (!el) return;\n    el.classList.add('loading-screen-ready');\n    el.setAttribute('aria-hidden', 'true');\n    setTimeout(function () {\n      if (el && el.parentNode) el.parentNode.removeChild(el);\n    }, 700);\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', hideLoading, { once: true });\n  } else {\n    hideLoading();\n  }\n\n  window.addEventListener('load', hideLoading, { once: true });\n  setTimeout(hideLoading, 1200);\n  setTimeout(hideLoading, 4000);\n})();\n</script>\n'''

          if 'id="loading-screen-repair"' not in text:
              text = text.replace('</head>', css + '</head>', 1)
          if 'id="loading-screen-repair-script"' not in text:
              text = text.replace('</body>', js + '</body>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remover travamento da tela de carregamento'
          git push