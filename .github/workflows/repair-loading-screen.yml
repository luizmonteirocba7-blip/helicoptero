name: Repair loading screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir evidencias da Semana de Prevencao
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          section_start = text.find('<section id="evidencias"')
          if section_start == -1:
              raise SystemExit('Secao de evidencias nao encontrada')
          section_end = text.find('</section>', section_start)
          if section_end == -1:
              raise SystemExit('Fim da secao de evidencias nao encontrado')

          section = text[section_start:section_end]

          def card_chunk(comment):
              start = section.find(comment)
              if start == -1:
                  raise SystemExit(f'Cartao nao encontrado: {comment}')
              next_comment = section.find('<!-- ', start + len(comment))
              return start, (next_comment if next_comment != -1 else len(section))

          # Restaura os links originais do primeiro card, que foram alterados por uma rotina anterior.
          start, end = card_chunk('<!-- Contratação BM Temporários -->')
          chunk = section[start:end]
          chunk = re.sub(
              r'data-pdf-src="[^"]*"',
              'data-pdf-src="https://drive.google.com/file/d/1p6ku1CchFagdipQXBr-Qx1Fyg2DV2mD0/view?usp=drive_link"',
              chunk,
              count=1,
          )
          chunk = re.sub(
              r'data-modal-src="[^"]*"',
              'data-modal-src="https://drive.google.com/file/d/12bf6WFyLYRb1BE5MAHFu4r02PvSHK18Q/view?usp=drive_link"',
              chunk,
              count=1,
          )
          section = section[:start] + chunk + section[end:]

          # Localiza a Semana de Prevenção somente dentro da seção de evidências.
          start, end = card_chunk('<!-- 7. Semana de Prevenção -->')
          chunk = section[start:end]
          chunk = re.sub(
              r'data-pdf-src="[^"]*"',
              'data-pdf-src="https://drive.google.com/file/d/1GSiSlVIVDqyONO7nR9Y-PExRqwpzvOT5/view?usp=drive_link"',
              chunk,
              count=1,
          )
          chunk = re.sub(
              r'data-modal-src="[^"]*"',
              'data-modal-src="https://drive.google.com/file/d/1-7zqThIWPzd9V4ynh-Ty9xCW02cGTrrW/view?usp=drive_link"',
              chunk,
              count=1,
          )
          if 'data-drive-link="1"' not in chunk:
              thumb_pos = chunk.find('data-modal-src="')
              tag_end = chunk.find('>', thumb_pos)
              if thumb_pos != -1 and tag_end != -1:
                  chunk = chunk[:tag_end] + ' data-drive-link="1"' + chunk[tag_end:]
          section = section[:start] + chunk + section[end:]

          text = text[:section_start] + section + text[section_end:]
          p.write_text(text, encoding='utf-8')
          print('Links da Semana de Prevenção corrigidos.')
          PY

      - name: Validar HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          section_start = html.find('<section id="evidencias"')
          section_end = html.find('</section>', section_start)
          section = html[section_start:section_end]

          week_start = section.find('<!-- 7. Semana de Prevenção -->')
          week_end = section.find('<!-- 8. Missões de Combate -->', week_start)
          week = section[week_start:week_end]

          assert 'https://drive.google.com/file/d/1GSiSlVIVDqyONO7nR9Y-PExRqwpzvOT5/view?usp=drive_link' in week
          assert 'https://drive.google.com/file/d/1-7zqThIWPzd9V4ynh-Ty9xCW02cGTrrW/view?usp=drive_link' in week
          assert 'https://drive.google.com/file/d/1p6ku1CchFagdipQXBr-Qx1Fyg2DV2mD0/view?usp=drive_link' in section
          assert 'https://drive.google.com/file/d/12bf6WFyLYRb1BE5MAHFu4r02PvSHK18Q/view?usp=drive_link' in section
          assert '<html' in html and '</html>' in html
          print('HTML validado. Semana de Prevenção pronta.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: corrigir links da semana de prevencao'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
