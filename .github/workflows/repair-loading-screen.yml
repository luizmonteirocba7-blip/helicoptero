name: Repair loading screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar Semana de Prevencao
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          pdf_url = 'https://drive.google.com/file/d/1GSiSlVIVDqyONO7nR9Y-PExRqwpzvOT5/view?usp=drive_link'
          fotos_url = 'https://drive.google.com/file/d/1-7zqThIWPzd9V4ynh-Ty9xCW02cGTrrW/view?usp=drive_link'

          start = text.find('<!-- 7. Semana de Prevenção -->')
          end = text.find('<!-- 8. Missões de Combate -->', start)
          if start == -1 or end == -1:
              raise SystemExit('Cartao Semana de Prevenção nao encontrado')

          chunk = text[start:end]

          # Troca somente os dois campos deste cartão.
          pdf_match = re.search(r'data-pdf-src="([^"]*)"', chunk)
          foto_match = re.search(r'data-modal-src="([^"]*)"', chunk)
          if not pdf_match or not foto_match:
              raise SystemExit('Campos PDF/Fotos nao encontrados no cartao')

          chunk = chunk[:pdf_match.start()] + f'data-pdf-src="{pdf_url}"' + chunk[pdf_match.end():]
          foto_match = re.search(r'data-modal-src="([^"]*)"', chunk)
          chunk = chunk[:foto_match.start()] + f'data-modal-src="{fotos_url}" data-drive-link="1"' + chunk[foto_match.end():]

          text = text[:start] + chunk + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Semana de Prevenção atualizada.')
          PY

      - name: Validar HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html' in html and '</html>' in html
          assert 'https://drive.google.com/file/d/1GSiSlVIVDqyONO7nR9Y-PExRqwpzvOT5/view?usp=drive_link' in html
          assert 'https://drive.google.com/file/d/1-7zqThIWPzd9V4ynh-Ty9xCW02cGTrrW/view?usp=drive_link' in html
          print('HTML validado.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: atualizar links da semana de prevencao'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
