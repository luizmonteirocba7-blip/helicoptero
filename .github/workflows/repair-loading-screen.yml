name: Repair loading screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar evidencias solicitadas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          section_start = text.find('<section id="evidencias"')
          if section_start == -1:
              raise SystemExit('Secao de evidencias nao encontrada')
          section_end = text.find('</section>', section_start)
          if section_end == -1:
              raise SystemExit('Fim da secao de evidencias nao encontrado')
          section = text[section_start:section_end]

          def card_chunk(comment):
              start = section.find(comment)
              if start == -1:
                  raise SystemExit(f'Cartao nao encontrado: {comment}')
              next_comment = section.find('<!-- ', start + len(comment))
              return start, (next_comment if next_comment != -1 else len(section))

          start, end = card_chunk('<!-- Contratação BM Temporários -->')
          chunk = section[start:end]
          chunk = re.sub(r'data-pdf-src="[^"]*"', 'data-pdf-src="https://drive.google.com/file/d/1p6ku1CchFagdipQXBr-Qx1Fyg2DV2mD0/view?usp=drive_link"', chunk, count=1)
          chunk = re.sub(r'data-modal-src="[^"]*"', 'data-modal-src="https://drive.google.com/file/d/12bf6WFyLYRb1BE5MAHFu4r02PvSHK18Q/view?usp=drive_link"', chunk, count=1)
          section = section[:start] + chunk + section[end:]

          start, end = card_chunk('<!-- 7. Semana de Prevenção -->')
          chunk = section[start:end]
          chunk = re.sub(r'data-pdf-src="[^"]*"', 'data-pdf-src="https://drive.google.com/file/d/1GSiSlVIVDqyONO7nR9Y-PExRqwpzvOT5/view?usp=drive_link"', chunk, count=1)
          chunk = re.sub(r'data-modal-src="[^"]*"', 'data-modal-src="https://drive.google.com/file/d/1-7zqThIWPzd9V4ynh-Ty9xCW02cGTrrW/view?usp=drive_link"', chunk, count=1)
          thumb_pos = chunk.find('data-modal-src="')
          tag_end = chunk.find('>', thumb_pos)
          if thumb_pos != -1 and tag_end != -1 and 'data-drive-link="1"' not in chunk[thumb_pos:tag_end]:
              chunk = chunk[:tag_end] + ' data-drive-link="1"' + chunk[tag_end:]
          section = section[:start] + chunk + section[end:]

          start, end = card_chunk('<!-- 13. Publicações Matérias -->')
          chunk = section[start:end]
          chunk = re.sub(r'data-pdf-src="[^"]*"', 'data-pdf-src="https://drive.google.com/file/d/1sKtpNq6NBy21ca0rmVOopu_ckzx1w2RR/view?usp=drive_link"', chunk, count=1)
          chunk = re.sub(r'data-modal-src="[^"]*"', 'data-modal-src="https://drive.google.com/file/d/14vNEbmmwrIgn0nNRhPVg5IVCl-cK0R00/view?usp=drive_link"', chunk, count=1)
          thumb_pos = chunk.find('data-modal-src="')
          tag_end = chunk.find('>', thumb_pos)
          if thumb_pos != -1 and tag_end != -1 and 'data-drive-link="1"' not in chunk[thumb_pos:tag_end]:
              chunk = chunk[:tag_end] + ' data-drive-link="1"' + chunk[tag_end:]
          section = section[:start] + chunk + section[end:]

          start, end = card_chunk('<!-- 16. OP Órgãos Federais -->')
          chunk = section[start:end]
          chunk = re.sub(r'data-pdf-src="[^"]*"', 'data-pdf-src="https://drive.google.com/file/d/1_P82XUJms3bOinMcMwpY22128ZBsIkzJ/view?usp=drive_link"', chunk, count=1)
          chunk = re.sub(r'data-modal-src="[^"]*"', 'data-modal-src="https://drive.google.com/file/d/dummy' if False else 'data-modal-src="https://drive.google.com/file/d/1zXg0ACKOzyKsoe5hyi_FLaVLF_9I9aVg/view?usp=drive_link"', chunk, count=1)
          thumb_pos = chunk.find('data-modal-src="')
          tag_end = chunk.find('>', thumb_pos)
          if thumb_pos != -1 and tag_end != -1 and 'data-drive-link="1"' not in chunk[thumb_pos:tag_end]:
              chunk = chunk[:tag_end] + ' data-drive-link="1"' + chunk[tag_end:]
          section = section[:start] + chunk + section[end:]

          start, end = card_chunk('<!-- 15. BM FEM Capacitadas -->')
          chunk = section[start:end]
          chunk = re.sub(r'data-pdf-src="[^"]*"', 'data-pdf-src="https://drive.google.com/file/d/1_iIeNS5O1yvAGA2rG6OP9zTaB8LCd46S/view?usp=drive_link"', chunk, count=1)
          chunk = re.sub(r'data-modal-src="[^"]*"', 'data-modal-src="https://drive.google.com/file/d/1_h7XK1TZt0Qbfuut5sEso4VvqTWcKR2-/view?usp=drive_link"', chunk, count=1)
          thumb_pos = chunk.find('data-modal-src="')
          tag_end = chunk.find('>', thumb_pos)
          if thumb_pos != -1 and tag_end != -1 and 'data-drive-link="1"' not in chunk[thumb_pos:tag_end]:
              chunk = chunk[:tag_end] + ' data-drive-link="1"' + chunk[tag_end:]
          section = section[:start] + chunk + section[end:]

          text = text[:section_start] + section + text[section_end:]
          p.write_text(text, encoding='utf-8')
          print('Evidencias solicitadas configuradas.')
          PY

      - name: Diferenciar cards azuis e vermelhos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css_blue = '''\n<style id="evidence-card-complete-styles">\n#evidencias .evidence-card-complete {\n  background: rgba(30, 64, 175, 0.32) !important;\n  border-color: rgba(96, 165, 250, 0.72) !important;\n  box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.16), 0 8px 24px rgba(30, 64, 175, 0.18) !important;\n}\n#evidencias .evidence-card-complete:hover {\n  background: rgba(30, 64, 175, 0.40) !important;\n  border-color: rgba(147, 197, 253, 0.90) !important;\n}\n</style>\n'''
          if 'id="evidence-card-complete-styles"' not in text:
              text = text.replace('</head>', css_blue + '</head>', 1)

          start = text.find('<section id="evidencias"')
          end = text.find('</section>', start)
          if start == -1 or end == -1:
              raise SystemExit('Secao de evidencias nao encontrada')
          section = text[start:end]

          parts = section.split('\n          <!-- ')
          new_parts = [parts[0]]
          for raw in parts[1:]:
              chunk = '\n          <!-- ' + raw
              open_pos = chunk.find('<div class="')
              if open_pos != -1:
                  open_end = chunk.find('>', open_pos)
                  open_tag = chunk[open_pos:open_end + 1] if open_end != -1 else ''
                  if open_tag and 'bg-slate-800/80' in open_tag and re.search(r'\bev-(?:foot|thumb)\b', chunk):
                      controls = re.findall(r'<(?:button|a)[^>]*class="[^"]*\bev-(?:foot|thumb)\b[^"]*"[^>]*>', chunk, flags=re.I)
                      complete = bool(controls)
                      is_publicacoes = chunk.startswith('\n          <!-- 13. Publicações Matérias -->')
                      for control in controls:
                          if re.search(r'\bev-foot\b', control):
                              href = re.search(r'\bhref="([^"]*)"', control, flags=re.I)
                              pdf = re.search(r'\bdata-pdf-src="([^"]*)"', control, flags=re.I)
                              valid = bool((href and href.group(1).strip()) or (pdf and pdf.group(1).strip()))
                          else:
                              modal = re.search(r'\bdata-modal-src="([^"]*)"', control, flags=re.I)
                              src = modal.group(1).strip() if modal else ''
                              valid = True if is_publicacoes else (bool(src) and not re.search(r'placehold\.co|Aguardando\+Fotos', src, flags=re.I))
                          complete = complete and valid

                      clean_tag = re.sub(r'\s*evidence-card-missing\b', '', open_tag)
                      clean_tag = re.sub(r'\s*evidence-card-complete\b', '', clean_tag)
                      clean_tag = re.sub(r'\s{2,}', ' ', clean_tag)
                      if complete:
                          clean_tag = clean_tag.replace('class="', 'class="evidence-card-complete ', 1)
                      else:
                          clean_tag = clean_tag.replace('class="', 'class="evidence-card-missing ', 1)
                      chunk = chunk[:open_pos] + chunk[open_pos:].replace(open_tag, clean_tag, 1)
              new_parts.append(chunk[len('\n          <!-- '):])

          new_section = '\n          <!-- '.join(new_parts)
          text = text[:start] + new_section + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Classificacao visual concluida.')
          PY

      - name: Corrigir especificamente BM FEM para azul
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          section_start = text.find('<section id="evidencias"')
          section_end = text.find('</section>', section_start)
          section = text[section_start:section_end]

          card_start = section.find('<!-- 15. BM FEM Capacitadas -->')
          card_end = section.find('<!-- 16. OP Órgãos Federais -->', card_start)
          if card_start == -1 or card_end == -1:
              raise SystemExit('Cartao BM FEM nao encontrado')

          chunk = section[card_start:card_end]
          open_pos = chunk.find('<div class="')
          open_end = chunk.find('>', open_pos)
          if open_pos == -1 or open_end == -1:
              raise SystemExit('Tag do card BM FEM nao encontrada')

          open_tag = chunk[open_pos:open_end + 1]
          clean_tag = re.sub(r'\s*evidence-card-missing\b', '', open_tag)
          clean_tag = re.sub(r'\s*evidence-card-complete\b', '', clean_tag)
          clean_tag = re.sub(r'\s{2,}', ' ', clean_tag)
          clean_tag = clean_tag.replace('class="', 'class="evidence-card-complete ', 1)
          chunk = chunk[:open_pos] + chunk[open_pos:].replace(open_tag, clean_tag, 1)

          section = section[:card_start] + chunk + section[card_end:]
          text = text[:section_start] + section + text[section_end:]
          p.write_text(text, encoding='utf-8')
          print('BM FEM Capacitadas forcada como card azul.')
          PY

      - name: Validar HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<html' in html and '</html>' in html
          assert html.count('id="evidence-card-missing-styles"') == 1
          assert html.count('id="evidence-card-complete-styles"') == 1

          checks = {
              'Publicações Matérias PDF': ('<!-- 13. Publicações Matérias -->', '<!-- 14. Focos de Calor -->', 'https://drive.google.com/file/d/1sKtpNq6NBy21ca0rmVOopu_ckzx1w2RR/view?usp=drive_link'),
              'Publicações Matérias Foto': ('<!-- 13. Publicações Matérias -->', '<!-- 14. Focos de Calor -->', 'https://drive.google.com/file/d/14vNEbmmwrIgn0nNRhPVg5IVCl-cK0R00/view?usp=drive_link'),
              'OP Órgãos Federais PDF': ('<!-- 16. OP Órgãos Federais -->', '<!-- 17. OP Combate (Parceria) -->', 'https://drive.google.com/file/d/1_P82XUJms3bOinMcMwpY22128ZBsIkzJ/view?usp=drive_link'),
              'OP Órgãos Federais Foto': ('<!-- 16. OP Órgãos Federais -->', '<!-- 17. OP Combate (Parceria) -->', 'https://drive.google.com/file/d/1zXg0ACKOzyKsoe5hyi_FLaVLF_9I9aVg/view?usp=drive_link'),
              'BM FEM PDF': ('<!-- 15. BM FEM Capacitadas -->', '<!-- 16. OP Órgãos Federais -->', 'https://drive.google.com/file/d/1_iIeNS5O1yvAGA2rG6OP9zTaB8LCd46S/view?usp=drive_link'),
              'BM FEM Foto': ('<!-- 15. BM FEM Capacitadas -->', '<!-- 16. OP Órgãos Federais -->', 'https://drive.google.com/file/d/1_h7XK1TZt0Qbfuut5sEso4VvqTWcKR2-/view?usp=drive_link'),
          }
          for name, (a, b, expected) in checks.items():
              s = html.find(a); e = html.find(b, s); chunk = html[s:e]
              assert expected in chunk, name

          s = html.find('<!-- 15. BM FEM Capacitadas -->'); e = html.find('<!-- 16. OP Órgãos Federais -->', s); fem = html[s:e]
          assert re.search(r'class="evidence-card-complete\s+bg-slate-800/80', fem)
          assert 'evidence-card-missing' not in fem.split('>')[0]
          print('HTML validado. Evidencias configuradas.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: configurar foto de publicacoes'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
