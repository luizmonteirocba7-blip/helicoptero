name: Repair loading screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch loading screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          marker = '<div id="loading-screen"'
          if marker in text and 'style="display:none!important"' not in text[text.find(marker):text.find(marker)+300]:
              text = text.replace(marker, '<div id="loading-screen" style="display:none!important"', 1)

          css = '''\n<style id="loading-screen-repair">\n#loading-screen {\n  display: none !important;\n  pointer-events: none !important;\n}\n#loading-screen.loading-screen-ready {\n  display: none !important;\n  opacity: 0 !important;\n  visibility: hidden !important;\n}\n</style>\n'''

          if 'id="loading-screen-repair"' not in text:
              text = text.replace('</head>', css + '</head>', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: ocultar tela de carregamento imediatamente'
          git push