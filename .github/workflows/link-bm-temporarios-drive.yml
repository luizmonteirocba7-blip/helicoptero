name: Link BM Temporários Drive

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  update-evidence-link:
    if: ${{ !contains(github.event.head_commit.message, 'BM-TEMP-DRIVE') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update BM Temporários links
        env:
          PDF_URL: 'https://drive.google.com/file/d/1p6ku1CchFagdipQXBr-Qx1Fyg2DV2mD0/view?usp=drive_link'
          PHOTO_URL: 'https://drive.google.com/file/d/12bf6WFyLYRb1BE5MAHFu4r02PvSHK18Q/view?usp=drive_link'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<h4 class="text-white text-[13px] font-bold leading-snug">Contratação BM Temporários</h4>'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Card BM Temporários não encontrado')
          end = text.find('<!-- Contratação de BM Efetivo -->', start)
          if end < 0:
              raise SystemExit('Próximo card não encontrado')

          section = text[start:end]
          section2, pdf_count = re.subn(r'data-pdf-src="[^"]*"', 'data-pdf-src="' + os.environ['PDF_URL'] + '"', section, count=1)
          if pdf_count != 1:
              raise SystemExit('data-pdf-src não encontrado')
          section3, photo_count = re.subn(r'data-modal-src="[^"]*"', 'data-modal-src="' + os.environ['PHOTO_URL'] + '" data-drive-link="1"', section2, count=1)
          if photo_count != 1:
              raise SystemExit('data-modal-src não encontrado')

          text = text[:start] + section3 + text[end:]

          old = """    if (t.matches('.ev-thumb')) openModal(t.dataset.modalSrc || '', t.dataset.pdfSrc || '');\n    if (t.matches('.ev-foot')) openPdfModal(t.dataset.pdfSrc || '');"""
          new = """    if (t.matches('.ev-thumb')) {\n        const src = t.dataset.modalSrc || '';\n        if (t.dataset.driveLink === '1' && src) {\n            window.open(src, '_blank', 'noopener,noreferrer');\n        } else {\n            openModal(src, t.dataset.pdfSrc || '');\n        }\n    }\n    if (t.matches('.ev-foot')) {\n        const pdfSrc = t.dataset.pdfSrc || '';\n        if (/drive\\.google\\.com/i.test(pdfSrc)) {\n            window.open(pdfSrc, '_blank', 'noopener,noreferrer');\n        } else {\n            openPdfModal(pdfSrc);\n        }\n    }"""
          if old not in text:
              raise SystemExit('Handler de evidências não encontrado')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: link BM Temporários PDF and photos BM-TEMP-DRIVE'
          git push