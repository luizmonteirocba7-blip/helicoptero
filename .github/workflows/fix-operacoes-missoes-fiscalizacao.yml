name: Corrigir cards Operações e Missões de Fiscalização

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separar cards e corrigir evidências
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          PDF = 'https://drive.google.com/file/d/1Jm7rMRiALdTDgZT4bsw3rXGo6z5hDI4K/view?usp=drive_link'
          OP_PDF = 'https://drive.google.com/file/d/1UlHa5opiD8_cnPwegqZseJFOiR5TsHkn/view?usp=drive_link'
          OP_FOTO = 'https://drive.google.com/file/d/1-326qamxNqGbkLUZHIjXg69yGko51mRN/view?usp=drive_link'
          FOTO = 'https://drive.google.com/file/d/1i5VOf-RKl88KPpeqM9-dGcdkeQAYyqU4/view?usp=drive_link'
          PLACEHOLDER = 'https://placehold.co/1200x800/1e293b/94a3b8?text=Aguardando+Fotos&font=Montserrat'

          def get_card(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Card não encontrado: {marker}')
              next_marker = text.find('\n          <!--', start + len(marker))
              if next_marker < 0:
                  next_marker = len(text)
              return start, next_marker, text[start:next_marker]

          def normalize_class(chunk, complete):
              chunk = re.sub(r'\bevidence-card-(?:complete|missing)\b', '', chunk)
              desired = 'evidence-card-complete' if complete else 'evidence-card-missing'
              chunk = re.sub(r'(<div[^>]*class=")', r'\1' + desired + ' ', chunk, count=1)
              chunk = re.sub(r'\sstyle="[^"]*"', '', chunk, count=1)
              return chunk

          def set_attr(chunk, attr, value):
              pattern = rf'{attr}="[^"]*"'
              if not re.search(pattern, chunk, flags=re.I):
                  raise SystemExit(f'Atributo {attr} não encontrado')
              return re.sub(pattern, f'{attr}="{value}"', chunk, count=1, flags=re.I)

          # 9. Operações de Fiscalização = COM conteúdo -> azul.
          start, end, chunk = get_card(text, '<!-- 9. Operações de Fiscalização -->')
          chunk = normalize_class(chunk, complete=True)
          chunk = set_attr(chunk, 'data-pdf-src', OP_PDF)
          chunk = set_attr(chunk, 'data-modal-src', OP_FOTO)
          if 'data-drive-link=' in chunk:
              chunk = re.sub(r'data-drive-link="[^"]*"', 'data-drive-link="1"', chunk, count=1)
          else:
              chunk, added = re.subn(r'(<button\b[^>]*data-modal-src="[^"]*")(?=>)', r'\1 data-drive-link="1"', chunk, count=1)
              if added != 1:
                  raise SystemExit('Botão FOTOS de Operações de Fiscalização não encontrado.')
          text = text[:start] + chunk + text[end:]

          # 10. Missões de Fiscalização = COM conteúdo -> azul.
          start, end, chunk = get_card(text, '<!-- 10. Missões de Fiscalização -->')
          chunk = normalize_class(chunk, complete=True)
          chunk = set_attr(chunk, 'data-pdf-src', PDF)
          chunk = set_attr(chunk, 'data-modal-src', FOTO)

          button_pattern = r'(<button\b[^>]*data-modal-src="[^"]*")(?=>)'
          if 'data-drive-link=' in chunk:
              chunk = re.sub(r'data-drive-link="[^"]*"', 'data-drive-link="1"', chunk, count=1)
          else:
              chunk, added = re.subn(button_pattern, r'\1 data-drive-link="1"', chunk, count=1)
              if added != 1:
                  raise SystemExit('Botão FOTOS de Missões de Fiscalização não encontrado.')

          text = text[:start] + chunk + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Cards corrigidos: Operações sem evidências; Missões com PDF e fotos + link externo.')
          PY

      - name: Sincronizar títulos da Visão Geral com a Central de Comprovações
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          mapping = {
              'Infrações Administrativas': 'Infrações Administrativas',
              'Perícia de Incêndios': 'Perícia de Incêndios',
              'Prevenção e Combate': 'Prevenção e Combate',
              'Aeronave Remotamente Pilotada': 'Drone (RPAS)',
              'Fogo Técnico': 'Fogo Técnico',
              'Campanhas': 'Campanhas',
              'Semana de Prevenção': 'Semana de Prevenção',
              'Missões de Combate': 'Missões de Combate',
              'Operações de Fiscalização': 'Operações de Fiscalização',
              'Missões de Fiscalização': 'Missões de Fiscalização',
              'Capacitação de Brigadistas': 'Formação de Brigadistas',
              'Brigada Municipal Mista': 'Brigada Municipal Mista',
              'Publicações': 'Publicações Matérias',
              'Focos de Calor': 'Focos de Calor',
              'BM FEM Capacitadas': 'BM FEM Capacitadas',
              'Op órgãos federais': 'OP Órgãos Federais',
              'Op de Combate': 'OP Combate (Parceria)',
              'Eventos Integrados': 'Eventos Integrados',
              'Área Monitorada': 'Área Monitorada',
              'Autos de Infração': 'Autos de Infração',
          }

          changed = 0
          for metric, title in mapping.items():
              card_pattern = re.compile(
                  r'(<button[^>]*class="[^"]*\bkpi-card\b[^"]*"[^>]*data-metric="' + re.escape(metric) + r'"[^>]*>.*?<div class="kpi-label">)(.*?)(</div>)',
                  re.S|re.I
              )
              text, count = card_pattern.subn(lambda m: m.group(1) + title + m.group(3), text, count=1)
              changed += count

          if changed != len(mapping):
              raise SystemExit(f'Foram sincronizados {changed} de {len(mapping)} títulos; abortando para não alterar parcialmente o painel.')

          p.write_text(text, encoding='utf-8')
          print(f'Títulos sincronizados com sucesso: {changed}')
          PY

      - name: Validar estado final dos cards e títulos
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          OP_PDF = 'https://drive.google.com/file/d/1UlHa5opiD8_cnPwegqZseJFOiR5TsHkn/view?usp=drive_link'
          OP_FOTO = 'https://drive.google.com/file/d/1-326qamxNqGbkLUZHIjXg69yGko51mRN/view?usp=drive_link'

          def get_chunk(marker):
              start = html.find(marker)
              assert start >= 0, marker
              end = html.find('\n          <!--', start + len(marker))
              if end < 0:
                  end = len(html)
              return html[start:end]

          oper = get_chunk('<!-- 9. Operações de Fiscalização -->')
          mis = get_chunk('<!-- 10. Missões de Fiscalização -->')

          assert 'evidence-card-complete' in oper
          assert OP_PDF in oper
          assert OP_FOTO in oper
          assert 'data-drive-link="1"' in oper
          assert 'data-pdf-src=""' not in oper
          assert 'Aguardando+Fotos' not in oper

          assert 'evidence-card-complete' in mis
          assert '1Jm7rMRiALdTDgZT4bsw3rXGo6z5hDI4K' in mis
          assert '1i5VOf-RKl88KPpeqM9-dGcdkeQAYyqU4' in mis
          assert 'data-drive-link="1"' in mis

          expected_titles = [
              'Infrações Administrativas','Perícia de Incêndios','Prevenção e Combate','Drone (RPAS)','Fogo Técnico',
              'Campanhas','Semana de Prevenção','Missões de Combate','Operações de Fiscalização','Missões de Fiscalização',
              'Formação de Brigadistas','Brigada Municipal Mista','Publicações Matérias','Focos de Calor','BM FEM Capacitadas',
              'OP Órgãos Federais','OP Combate (Parceria)','Eventos Integrados','Área Monitorada','Autos de Infração'
          ]
          for title in expected_titles:
              assert f'<div class="kpi-label">{title}</div>' in html, f'Título ausente: {title}'

          print('Validação OK: cards e títulos sincronizados com a Central de Comprovações.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: sincronizar titulos da visao geral'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
