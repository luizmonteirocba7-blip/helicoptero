name: Diferenciar evidencias pendentes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar regra segura nas caixas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\n<style id="evidence-card-(?:status|missing)-styles">.*?</style>\n', '\n', text, flags=re.S)
          text = re.sub(r'\n<script id="evidence-card-(?:status|missing)-script">.*?</script>\n', '\n', text, flags=re.S)
          css = '''\n<style id="evidence-card-missing-styles">\n#evidencias .evidence-card-missing {\n  background: linear-gradient(145deg, rgba(127,29,29,.48), rgba(220,38,38,.18)) !important;\n  border-color: rgba(248,113,113,.82) !important;\n  box-shadow: inset 0 0 0 1px rgba(248,113,113,.18), 0 8px 22px rgba(127,29,29,.14) !important;\n}\n#evidencias .evidence-card-missing:hover {\n  background: linear-gradient(145deg, rgba(127,29,29,.56), rgba(220,38,38,.24)) !important;\n  border-color: rgba(254,202,202,.95) !important;\n}\n</style>\n'''
          js = '''\n<script id="evidence-card-missing-script">\n(function () {\n  function hasEvidence(el) {\n    if (!el) return false;\n    if (el.classList.contains('ev-foot')) {\n      return Boolean(((el.getAttribute('href') || '') || (el.getAttribute('data-pdf-src') || '')).trim());\n    }\n    if (el.classList.contains('ev-thumb')) {\n      const src = (el.getAttribute('data-modal-src') || '').trim();\n      return Boolean(src) && !/placehold\\.co/i.test(src) && !/Aguardando\\+Fotos/i.test(src);\n    }\n    return true;\n  }\n  function updateEvidenceCards() {\n    const area = document.getElementById('evidencias');\n    if (!area) return;\n    area.querySelectorAll('.bg-slate-800\\/80').forEach(function (card) {\n      const controls = Array.from(card.querySelectorAll('.ev-foot, .ev-thumb'));\n      if (!controls.length) return;\n      card.classList.toggle('evidence-card-missing', !controls.every(hasEvidence));\n    });\n  }\n  function start() {\n    updateEvidenceCards();\n    setTimeout(updateEvidenceCards, 1000);\n    setTimeout(updateEvidenceCards, 2500);\n  }\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', start, { once: true });\n  } else {\n    start();\n  }\n})();\n</script>\n'''
          if 'evidence-card-missing-styles' not in text:
              text = text.replace('</head>', css + '</head>', 1)
          if 'evidence-card-missing-script' not in text:
              text = text.replace('</body>', js + '</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: diferenciar caixas de evidencias pendentes'
          git push
