name: Diferenciar evidencias pendentes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar regra segura nas caixas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove somente versões anteriores das rotinas de destaque, sem tocar
          # no restante do painel nem na lógica de carregamento.
          text = re.sub(r'\n<style id="evidence-card-(?:status|missing)-styles">.*?</style>\n', '\n', text, flags=re.S)
          text = re.sub(r'\n<script id="evidence-card-(?:status|missing)-script">.*?</script>\n', '\n', text, flags=re.S)

          css = r'''
<style id="evidence-card-missing-styles">
#evidencias .evidence-card-missing {
  background: linear-gradient(145deg, rgba(127,29,29,.48), rgba(220,38,38,.18)) !important;
  border-color: rgba(248,113,113,.82) !important;
  box-shadow: inset 0 0 0 1px rgba(248,113,113,.18), 0 8px 22px rgba(127,29,29,.14) !important;
}
#evidencias .evidence-card-missing:hover {
  background: linear-gradient(145deg, rgba(127,29,29,.56), rgba(220,38,38,.24)) !important;
  border-color: rgba(254,202,202,.95) !important;
}
</style>
'''

          js = r'''
<script id="evidence-card-missing-script">
(function () {
  function hasEvidence(el) {
    if (!el) return false;
    if (el.classList.contains('ev-foot')) {
      const href = (el.getAttribute('href') || '').trim();
      const src = (el.getAttribute('data-pdf-src') || '').trim();
      return !!(href || src);
    }
    if (el.classList.contains('ev-thumb')) {
      const src = (el.getAttribute('data-modal-src') || '').trim();
      return !!src && !/placehold\.co/i.test(src) && !/Aguardando\+Fotos/i.test(src);
    }
    return true;
  }

  function updateEvidenceCards() {
    const area = document.getElementById('evidencias');
    if (!area) return;

    area.querySelectorAll('.bg-slate-800\\/80').forEach(function (card) {
      const pdfs = Array.from(card.querySelectorAll('.ev-foot'));
      const photos = Array.from(card.querySelectorAll('.ev-thumb'));
      const controls = pdfs.concat(photos);
      if (!controls.length) return;

      const complete = controls.every(hasEvidence);
      card.classList.toggle('evidence-card-missing', !complete);
    });
  }

  function start() {
    updateEvidenceCards();
    setTimeout(updateEvidenceCards, 1000);
    setTimeout(updateEvidenceCards, 2500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
'''

          text = text.replace('</head>', css + '\n</head>', 1)
          text = text.replace('</body>', js + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: diferenciar caixas de evidencias pendentes'
          git push
