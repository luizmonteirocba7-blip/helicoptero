name: Sincronizar títulos dos cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar somente os títulos visíveis
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Nomes oficiais da Central de Comprovações.
          exact_titles = {
              'Infrações Administrativas': 'Infrações Administrativas',
              'Perícia de Incêndios': 'Perícia de Incêndios',
              'Prevenção e Combate': 'Prevenção e Combate',
              'Aeronave Remotamente Pilotada': 'Drone (RPAS)',
              'Fogo Técnico': 'Fogo Técnico',
              'Campanhas': 'Campanhas',
              'Semana de Prevenção': 'Semana de Prevenção',
              'Missões de Combate': 'Missões de Combate',
              'Operações de Fiscalização': 'Operações de Fiscalização',
              'Missões de Fiscalização': 'Missões de Fiscalização',
              'Capacitação de Brigadistas': 'Formação de Brigadistas',
              'Brigada Municipal Mista': 'Brigada Municipal Mista',
              'Publicações': 'Publicações Matérias',
              'Focos de Calor': 'Focos de Calor',
              'BM FEM Capacitadas': 'BM FEM Capacitadas',
              'Op órgãos federais': 'OP Órgãos Federais',
              'Op de Combate': 'OP Combate (Parceria)',
              'Eventos Integrados': 'Eventos Integrados',
              'Área Monitorada': 'Área Monitorada',
              'Autos de Infração': 'Autos de Infração',
          }

          changed = 0
          for metric, title in exact_titles.items():
              pattern = re.compile(
                  r'(<button[^>]*data-metric="' + re.escape(metric) + r'"[^>]*>.*?<div class="kpi-label">)(.*?)(</div>)',
                  re.DOTALL,
              )
              html, count = pattern.subn(lambda m: m.group(1) + title + m.group(3), html, count=1)
              changed += count

          path.write_text(html, encoding='utf-8')
          print(f'Cards sincronizados: {changed}')

      - name: Commit e limpeza
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de títulos necessária."
          else
            git commit -m "fix: alinhar titulos dos cards com comprovacoes"
            git push
            exit 0
          fi

          git rm .github/workflows/sync-kpi-titles-once.yml
          git commit -m "chore: remover rotina temporaria de sincronizacao"
          git push
