name: Vincular evidências de Operações de Fiscalização

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar links do Drive
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          pdf = 'https://drive.google.com/file/d/1Nfk2QLVKfYePxZZkA0VpQadxCK36a4Le/view?usp=drive_link'
          foto = 'https://drive.google.com/file/d/14Yl6WjF5w7QgvBXGLIjnfVB951D71Fwa/view?usp=drive_link'

          marker = '<!-- 9. Operações de Fiscalização -->'
          next_marker = '<!-- 10. Missões de Fiscalização -->'
          start = text.find(marker)
          end = text.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Card de Operações de Fiscalização não encontrado.')

          card = text[start:end]
          card = re.sub(r'evidence-card-(?:complete|missing)', 'evidence-card-complete', card, count=1)
          card = re.sub(r'data-pdf-src="[^"]*"', f'data-pdf-src="{pdf}"', card, count=1)
          card = re.sub(r'data-modal-src="[^"]*"', f'data-modal-src="{foto}" data-drive-link="1"', card, count=1)

          text = text[:start] + card + text[end:]
          p.write_text(text, encoding='utf-8')
          print('Operações de Fiscalização: links canônicos e card completo aplicados.')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.find('<!-- 9. Operações de Fiscalização -->')
          end = html.find('<!-- 10. Missões de Fiscalização -->', start)
          block = html[start:end]
          assert 'evidence-card-complete' in block
          assert '1Nfk2QLVKfYePxZZkA0VpQadxCK36a4Le' in block
          assert '14Yl6WjF5w7QgvBXGLIjnfVB951D71Fwa' in block
          assert 'data-drive-link="1"' in block
          print('Validação OK.')
          PY

      - name: Commit e sincronizar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: vincular evidencias canonicas de operacoes de fiscalizacao'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
